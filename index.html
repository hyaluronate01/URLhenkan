<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ひらがなURL変換ツール</title>

<style>
    body {
        font-family: sans-serif;
        max-width: 1000px;
        margin: 30px auto;
        padding: 0 20px;
        background: #f5f5f5;
    }

    h1 {
        margin-bottom: 5px;
    }

    .description {
        color: #555;
        margin-bottom: 20px;
    }

    .label {
        font-weight: bold;
        margin: 10px 0 6px;
    }

    textarea {
        width: 100%;
        height: 180px;
        box-sizing: border-box;
        resize: vertical;
        padding: 12px;
        font-size: 16px;
        border: 1px solid #aaa;
        border-radius: 6px;
        background: white;
    }

    .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 15px 0;
    }

    button {
        padding: 10px 18px;
        font-size: 15px;
        cursor: pointer;
        border: 1px solid #888;
        border-radius: 6px;
        background: white;
    }

    button:hover {
        background: #e8e8e8;
    }

    .download {
        margin-top: 5px;
    }

    .status {
        margin-top: 10px;
        padding: 10px;
        border-radius: 6px;
        background: white;
        border: 1px solid #ccc;
        min-height: 20px;
    }

    .info {
        margin-top: 20px;
        padding: 15px;
        background: white;
        border: 1px solid #ccc;
        border-radius: 6px;
        line-height: 1.7;
    }

    code {
        background: #eee;
        padding: 2px 5px;
        border-radius: 3px;
    }

    hr {
        margin: 25px 0;
        border: 0;
        border-top: 1px solid #ccc;
    }
</style>
</head>

<body>

<h1>ひらがなURL変換ツール</h1>

<div class="description">
    URLなどの文字列を、ひらがなだけの文字列に変換できます。
</div>


<div class="label">入力</div>

<textarea id="input"
    placeholder="ここにURLや文章を入力してください"></textarea>


<div class="buttons">

    <button onclick="encodeText()">
        ひらがなに変換
    </button>

    <button onclick="decodeText()">
        元に戻す
    </button>

    <button onclick="copyOutput()">
        結果をコピー
    </button>

    <button onclick="swapText()">
        入力・結果を入れ替え
    </button>

    <button onclick="clearAll()">
        クリア
    </button>

</div>


<div class="label">結果</div>

<textarea id="output"
    readonly
    placeholder="ここに結果が表示されます"></textarea>


<div id="status" class="status"></div>


<hr>


<button class="download" onclick="downloadThisHTML()">
    このツールをHTMLとしてダウンロード
</button>


<div class="info">

    <strong>このツールについて</strong>

    <br><br>

    URLなどの文字列を、46種類のひらがなだけを使って
    可逆変換します。

    <br><br>

    変換に使用する文字：

    <br>

    <code>
    あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん
    </code>

    <br><br>

    <strong>特徴</strong>

    <ul>
        <li>インストール不要</li>
        <li>Python不要</li>
        <li>サーバー不要</li>
        <li>ネット接続不要で変換可能</li>
        <li>URL以外の日本語文章にも使用可能</li>
        <li>変換した文字列を完全に元へ戻せます</li>
    </ul>

    <strong>注意：</strong>
    これは暗号化ではありません。
    秘密情報を隠す目的には使用しないでください。

</div>


<script>

// ============================================================
// ひらがな一覧
// ============================================================

const KANA =
    "あいうえおかきくけこ" +
    "さしすせそたちつてと" +
    "なにぬねのはひふへほ" +
    "まみむめもやゆよ" +
    "らりるれろわをん";


// ============================================================
// ひらがな → 番号
// ============================================================

const DECODE = {};

for (let i = 0; i < KANA.length; i++) {
    DECODE[KANA[i]] = i;
}


// ============================================================
// 文字列 → ひらがな
// ============================================================

function encodeText() {

    const input =
        document.getElementById("input").value;

    if (input.length === 0) {

        setStatus("入力がありません。");
        return;
    }

    try {

        const encoder = new TextEncoder();

        const bytes = encoder.encode(input);

        let result = "";

        for (const byte of bytes) {

            const a =
                Math.floor(byte / KANA.length);

            const b =
                byte % KANA.length;

            result += KANA[a];
            result += KANA[b];
        }

        document.getElementById("output").value =
            result;

        setStatus(
            "変換完了：" +
            bytes.length +
            "バイト → " +
            result.length +
            "文字"
        );

    } catch (error) {

        setStatus(
            "変換エラー：" +
            error.message
        );
    }
}


// ============================================================
// ひらがな → 元の文字列
// ============================================================

function decodeText() {

    let input =
        document.getElementById("input").value;

    if (input.length === 0) {

        setStatus("入力がありません。");
        return;
    }

    // 改行・スペースを無視
    input = input.replace(/\s/g, "");

    // 2文字で1バイト
    if (input.length % 2 !== 0) {

        setStatus(
            "エラー：文字数が奇数です。"
        );

        return;
    }

    try {

        const bytes =
            new Uint8Array(input.length / 2);

        let byteIndex = 0;

        for (let i = 0; i < input.length; i += 2) {

            const c1 = input[i];
            const c2 = input[i + 1];

            const a = DECODE[c1];
            const b = DECODE[c2];

            if (a === undefined ||
                b === undefined) {

                throw new Error(
                    "使用できない文字があります：" +
                    c1 + c2
                );
            }

            const value =
                a * KANA.length + b;

            if (value > 255) {

                throw new Error(
                    "不正なコードです。"
                );
            }

            bytes[byteIndex] = value;

            byteIndex++;
        }

        const decoder =
            new TextDecoder(
                "utf-8",
                { fatal: true }
            );

        const result =
            decoder.decode(bytes);

        document.getElementById("output").value =
            result;

        setStatus(
            "元の文字列に戻しました。"
        );

    } catch (error) {

        setStatus(
            "復号できませんでした。"
        );
    }
}


// ============================================================
// コピー
// ============================================================

async function copyOutput() {

    const output =
        document.getElementById("output").value;

    if (!output) {

        setStatus(
            "コピーする結果がありません。"
        );

        return;
    }

    try {

        await navigator.clipboard.writeText(output);

        setStatus(
            "クリップボードにコピーしました。"
        );

    } catch (error) {

        // 古いブラウザ等への対応
        try {

            const temp =
                document.createElement("textarea");

            temp.value = output;

            document.body.appendChild(temp);

            temp.select();

            document.execCommand("copy");

            document.body.removeChild(temp);

            setStatus(
                "クリップボードにコピーしました。"
            );

        } catch (error2) {

            setStatus(
                "コピーできませんでした。"
            );
        }
    }
}


// ============================================================
// 入力・結果を入れ替え
// ============================================================

function swapText() {

    const input =
        document.getElementById("input");

    const output =
        document.getElementById("output");

    const temp =
        input.value;

    input.value =
        output.value;

    output.value =
        temp;

    setStatus(
        "入力と結果を入れ替えました。"
    );
}


// ============================================================
// クリア
// ============================================================

function clearAll() {

    document.getElementById("input").value = "";

    document.getElementById("output").value = "";

    setStatus("");
}


// ============================================================
// ステータス
// ============================================================

function setStatus(message) {

    document.getElementById("status").textContent =
        message;
}


// ============================================================
// このHTML自身をダウンロード
// ============================================================

function downloadThisHTML() {

    // 現在表示されているHTML全体を取得
    let html =
        "<!DOCTYPE html>\n" +
        document.documentElement.outerHTML;

    const blob =
        new Blob(
            [html],
            {
                type:
                    "text/html;charset=utf-8"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "URLhenkan.html";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

    setStatus(
        "URLhenkan.html をダウンロードしました。"
    );
}

</script>

</body>
</html>
